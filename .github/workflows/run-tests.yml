name: 🧪 Run Forensic Unit Tests & Cyberdefense Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel build pillow

    - name: Run 12 Forensic Unit Tests
      run: |
        python3 BABAYAGA_CORE/run_tests.py

    - name: Run 4 AI Nodes Unit Tests
      run: |
        python3 BABAYAGA_CORE/test_ai_nodes.py
